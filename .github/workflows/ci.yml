# .github/workflows/ci.yml
name: CI Pipeline

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Lint
        run: flake8 .

      - name: Test
        run: pytest

      - name: Docker Login
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/toxicity-app:1.0 .

      - name: Push Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/toxicity-app:1.0

      - name: Run Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible
          ansible-playbook deploy.yml